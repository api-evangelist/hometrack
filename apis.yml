- aid: hometrack:hometrack-climate-graphql-api
  name: Hometrack Climate GraphQL API
  description: >-
    A GraphQL API registered in Hometrack's API Management catalogue with type "graphql" and path /climate/graphql,
    fronting the same climate data backend (web-uks-prod-data-api.azurewebsites.net/graphql). It is a
    real, listed API but its contract is not anonymously retrievable: the operations collection and the
    schema collection both returned empty arrays to an unauthenticated caller, so no GraphQL SDL could
    be harvested, and the OpenAPI export for it is a stub with servers and security schemes but no paths.
    Recorded here because absence of the schema is itself the finding.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com/climate/graphql

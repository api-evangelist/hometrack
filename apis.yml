apis:
- aid: hometrack:hometrack-valuation-api
  name: Hometrack Valuation API
  description: >-
    Described in Hometrack's own Azure API Management catalogue as the "Generally
    available version of the Valuation API". Three operations: POST
    /authentication/{apiKey} exchanges an API key for a temporary token valid for
    five minutes, GET /status reports whether the Valuation API is currently
    available, and POST /valuation/{accountId} runs a valuation on a given
    property. The valuation endpoint uses token-based authorization with an
    Authorization header of the form 'Token token="<guid>"' (Hometrack documents
    that it also accepts looser variants without the quotes or the token= prefix).
    GET /status is the one operation in Hometrack's entire published surface that
    answered an anonymous probe with HTTP 200 — it returned a zero-byte body,
    confirming the gateway is live.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com/valuation-api/v1
  tags:
  - Valuation
  - AVM
  - Real Estate
  - United Kingdom
  properties:
  - type: OpenAPI
    url: openapi/hometrack-valuation-api-v1-openapi.yml
  - type: Documentation
    url: https://developer.hometrack.com/apis
  - type: Authentication
    url: https://developer.hometrack.com/api-authentication
  - type: Authentication
    url: authentication/hometrack-auth0-openid-configuration.json
- aid: hometrack:hometrack-broker-avm-api
  name: Hometrack Broker AVM API
  description: >-
    Hometrack's own catalogue description is "This API provides access to the
    Broker AVM service." Twelve operations across two revisions (v1 and v2 paths
    served side by side): POST /broker/order creates a valuation order for a
    property, POST /broker/v2/order "creates the valuation order with climate data
    for the property", and GET operations retrieve the order, the order status,
    the valuation, the valuation input supplied at inception, and — on
    /internal/... paths — the raw valuation response "with all data, audit traces
    etc". The harvested request schema for a broker order is detailed and real:
    an order block with accountId, orderReference, userId and valuationType, and a
    valuations array carrying address (postcode, address, uprn), effectiveDate, a
    loan block (repaymentType, loanAmount, outstandingLoanAmount, additionalLoanAmount,
    remainingTerm, minimumRentalIncome, existingMortgage, instructionType) and a
    property block (bedrooms, receptions, propertyType, propertyStyle,
    constructionType, constructionPeriod, yearBuilt, floorArea, parking,
    exLocalAuthority, visibleFromRoad). Anonymous GET on this path returns HTTP 401.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com/valuation/v2
  tags:

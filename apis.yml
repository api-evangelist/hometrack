- aid: hometrack:hometrack-prh-core-external-client-api
  name: Hometrack PRH Core External Client API v2.0
  description: >-
    Catalogued by Hometrack as "(PRH) - Core External Client API v2.0 — Our PRH
    'Core' API offering to all customers who want it." PRH is Hometrack's Property
    Risk Hub, the case-management and surveyor-instruction platform sold to
    mortgage lenders. Nineteen operations under /organisation/{orgId}: create an
    instruction (POST /instruction) and reinstruct or reprocess an existing one
    (PUT /instruction); list and retrieve cases; retrieve a case filtered to a
    specific case process and that process's status; list, attach, retrieve and
    verify case documents; list and retrieve valuation reports attached to a case,
    including a /report/latest shortcut; read and post data-provider status updates
    on a case; and search the property valuation repository by postal code or
    repository id. The harvested schema document is the richest in Hometrack's
    catalogue at 257 component schemas, including a full "PRH - External Client
    API - Create Instruction - JSON schema" with a worked example.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com/prh

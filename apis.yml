apis:
- aid: hometrack:hometrack-broker-avm-api
  name: Hometrack Broker AVM API
  description: >-
    Hometrack's own catalogue description is "This API provides access to the Broker AVM service." Twelve
    operations across two revisions (v1 and v2 paths served side by side): POST /broker/order creates
    a valuation order for a property, POST /broker/v2/order "creates the valuation order with climate
    data for the property", and GET operations retrieve the order, the order status, the valuation, the
    valuation input supplied at inception, and — on /internal/... paths — the raw valuation response "with
    all data, audit traces etc". The harvested request schema for a broker order is detailed and real:
    an order block with accountId, orderReference, userId and valuationType, and a valuations array carrying
    address (postcode, address, uprn), effectiveDate, a loan block (repaymentType, loanAmount, outstandingLoanAmount,
    additionalLoanAmount, remainingTerm, minimumRentalIncome, existingMortgage, instructionType) and a
    property block (bedrooms, receptions, propertyType, propertyStyle, constructionType, constructionPeriod,
    yearBuilt, floorArea, parking, exLocalAuthority, visibleFromRoad). Anonymous GET on this path returns
    HTTP 401.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com/valuation/v2

summary: >-
  Hometrack publishes a dedicated changelog page on its developer portal, but it
  is empty. The page is a stock Azure API Management "api-history" widget bound
  to the portal's API catalogue; the widget renders per-API releases, and the
  anonymous data plane confirms every one of the six published APIs has an empty
  releases collection
  (GET /developer/apis/{apiId}/releases?api-version=2022-04-01-preview returns
  {"value": [], "nextLink": null} for prd-core-api-v2-0, broker-avm-api,
  climate-api-v2, climate-api-graphql, hometrack-api-public and
  realtime-proxy-api). So the change-communication surface exists structurally
  and carries no entries — change is communicated to customers through the
  commercial relationship, not through the portal.

- aid: hometrack:hometrack-api-public
  name: Hometrack API Public
  description: >-
    Catalogued by Hometrack as "Hometrack API for public consumption" and mounted
    at the gateway root. Twenty operations that are mostly account, licensing,
    branding and report-generation plumbing rather than a property data product:
    POST /api/authentication/{apiKey} exchanges an API key for a plain-text GUID
    token; /api/reporting/PropertyValuation requests and then downloads a Property
    Valuation Report; /api/brands/{token}/{targetAccountApiKey} reads and writes
    the co-branding configuration used on those reports; /api/licences/{token}/{product}
    returns the product licences belonging to the authenticated account;
    /api/partners and /api/zoopla/partners create and read partner-to-account
    entries under "partner.create" and "partner.modify" permissions; /api/pvrplugin
    endpoints serve the Property Valuation Report plugin; and /api/trial endpoints
    issue trial licences. The name is misleading — nothing here is callable without
    a Hometrack-issued API key, and the presence of a scheduled-task endpoint
    (GET /api/reporting/moveToBlobStorage) and two "For test purpose" endpoints
    suggests an internal API that has been published to the catalogue as-is.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com
  tags:

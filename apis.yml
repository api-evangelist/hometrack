- aid: hometrack:hometrack-climate-api
  name: Hometrack Climate API (v2)
  description: >-
    Five GET operations returning climate and energy risk data for a single
    property, keyed on UPRN — the Unique Property Reference Number, the UK's
    government-issued national property identifier: /epc-hometrack/{uprn} returns
    EPC (energy performance) data, /flood-twinn/{uprn} returns flood data,
    /ground-terrafirma/{uprn} returns ground data, /ground-subsidence-twinn/{uprn}
    returns subsidence score data and /ground-coastalerosion-twinn/{uprn} returns
    coastal erosion data. Four of the five take a dataVersion parameter, and the
    supplier is visible in the path segments — Twinn for flood, subsidence and
    coastal erosion, Terrafirma for ground. Every operation accepts X-Client-ID,
    X-Client-Reference and X-Correlation-ID tracking headers. The harvested schema
    document carries 35 component schemas covering the response models
    (FloodScoreResponseModelV2, SubsidenceScoreResponseModelV2,
    CoastalErosionScoreResponseModelV2, GroundScoreResponseModelV2,
    EnergyCertificateResponseModelV2 and their sub-models). The APIM contract
    records the backend as web-uks-prod-data-api.azurewebsites.net/v2.
  humanURL: https://developer.hometrack.com/apis
  baseURL: https://api.hometrack.com/climate

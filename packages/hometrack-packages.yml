summary: >-
  Hometrack ships no first-party client libraries. The GitHub organisation
  https://github.com/Hometrack exists but has zero public repositories, npm and
  PyPI have no Hometrack-published package, and the developer portal offers no
  SDK download. What the portal does provide is per-operation code samples
  generated by Azure API Management ("The API Documentation describes how to use
  the APIs and includes code samples in multiple languages") — generated
  snippets in the interactive console, not maintained, versioned client
  libraries. This artifact records the absence; no SDKs pointer is wired in
  apis.yml because there is no SDK to point at.

purpose: >-
  Bind every agent-facing tool to the REST operation that would back it, so each
  tool inherits a REAL input schema (that operation's parameters + requestBody)
  instead of a guessed one — and record where Hometrack's surfaces diverge.
  Hometrack is an unusual case for this artifact: there is no published MCP
  server, and its GraphQL API is registered but schema-gated, so the crosswalk
  documents an intended binding plus one genuinely unmappable surface.

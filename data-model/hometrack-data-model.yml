gaps:
- No published join key between the valuation, case-management and climate domains.
- valuationStatusResponse.status and order.valuationType are bare integer enums (0-3 / 0-2) with no documented meaning.
- The PRH schema component names are machine-generated (OrganisationOrgIdCase…Get200ApplicationJsonResponse, Generated, Generated-1) rather than domain names — 257 schemas, most of them per-operation response wrappers.

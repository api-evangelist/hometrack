aid: hometrack
url: https://raw.githubusercontent.com/api-evangelist/hometrack/refs/heads/main/apis.yml
name: Hometrack
kind: company
description: >-
  Hometrack is a United Kingdom property data, valuation and risk-decisioning
  company, founded in 1999 and now part of Houseful — the Silver Lake-owned group
  that also owns Zoopla, PrimeLocation, Alto and Jupix. It launched its automated
  valuation model in 2002 and says it now runs more than 50 million valuations a
  year, that 18 of the top 20 UK mortgage lenders use its AVM in their origination
  processes, and that it was the first AVM accredited by Moody's, Standard & Poor's
  and Fitch. It is a founding member of the European AVM Alliance. In the UK value
  chain it does not sit on the listings side at all: with no MLS in this market,
  residential listings are controlled by Rightmove and Zoopla and reach them through
  agency CRM software, while Hometrack sits on the lending and risk side —
  valuation, comparables, climate and property risk data, surveyor allocation and
  case management for mortgage lenders, surveyors, brokers, housing associations
  and investors. Its API posture is unusually revealing and must be stated in two
  halves. The developer surface is real and genuinely public: an Azure API
  Management developer portal at developer.hometrack.com is served anonymously,
  its data plane answers unauthenticated requests, and six APIs — a Valuation API,
  a Broker AVM API, a Property Risk Hub core client API, a Climate API, a Climate
  GraphQL API and an internal-facing public API — are listed there with full
  operation and schema metadata, from which six OpenAPI 3.0.1 documents were
  harvested. The access gate, however, is commercial: the portal states plainly
  that "to interact with any of our APIs you will need to have a valid API Key for
  that respective product. If you do not yet have an API Key, please contact us",
  and the gateway at api.hometrack.com answers anonymous calls with HTTP 401
  "Unauthorized. Access token is missing or invalid." Authentication is OAuth 2.0
  client credentials through Auth0 (hometrack-prod.eu.auth0.com) against the
  audience https://api.hometrack.com, with documented scopes read:valuations and
  write:valuations. So: contracts are readable by anyone, data is reachable by
  nobody without a Hometrack commercial agreement. There is no RESO Web API or
  Data Dictionary certification and no OData $metadata anywhere in Hometrack's
  stack — RESO is a North American NAR/MLS construct and the UK has no MLS to
  certify against. Notably, Hometrack's Climate API keys every property off the
  UPRN, the Unique Property Reference Number issued by GeoPlace and distributed by
  Ordnance Survey: the UK does have a universal property identifier, it just comes
  from government rather than from a real-estate standards body. Hometrack itself
  publishes no open data — the open UK property layer is HM Land Registry Price
  Paid and Ordnance Survey, not Hometrack.
